apply plugin: 'java'
apply plugin: 'application'

mainClassName = "com.zuehlke.jasschallenge.Application"

compileJava {
  sourceCompatibility = '1.8'
  targetCompatibility = '1.8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'com.microsoft.onnxruntime', name: 'onnxruntime', version: '1.21.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.6.0'
    implementation 'org.eclipse.jetty.websocket:websocket-client:9.3.4.RC0'
    implementation 'org.slf4j:slf4j-api:1.7.12'
    implementation 'ch.qos.logback:logback-classic:1.1.3'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
    testImplementation 'com.shazam:shazamcrest:0.11'
    testImplementation 'org.mockito:mockito-core:1.10.19'
    testImplementation 'com.pholser:junit-quickcheck-core:0.5-alpha-3'
}

run {
    if (project.hasProperty("modelPath") ) {
        args(modelPath)
    }
}